<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Birds of the Sahyadris</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      (function () {
        var theme = "light";
        try {
          var saved = window.localStorage.getItem("root-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="assets/css/main.css" />
  
<meta name="description" content="A searchable field guide to the birds of the Western Ghats, with species notes, classification, status, and photographs."><meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)"><link rel="manifest" href="sahyadri-birds.webmanifest"><link rel="icon" href="sahyadri-birds-icon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="sahyadri-birds-icon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="sahyadri-birds-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sahyadri Birds"><link rel="canonical" href="https://naniwadekar.com/sahyadri-birds/"><meta property="og:title" content="Birds of the Sahyadris"><meta name="twitter:card" content="summary_large_image"><meta property="og:site_name" content="Curiosities"><meta property="og:description" content="A searchable field guide to the birds of the Western Ghats, with species notes, classification, status, and photographs."><meta property="og:type" content="website"><meta property="og:url" content="https://naniwadekar.com/sahyadri-birds/"><meta property="og:image" content="https://naniwadekar.com/sahyadri-birds-icon-512.png">
</head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div>
          <div class="site-title">Birds of the Sahyadris</div>
          <div class="site-tagline">
            A field guide to the birds of the Western Ghats
          </div>
        </div>
        <div class="site-header-right">
          <nav class="site-tabs">
            <a class="site-tab-btn site-home-link" href="https://naniwadekar.com/">Curiosities</a>
            <a class="site-tab-btn site-home-link" href="https://naniwadekar.com/deccan/">Deccan</a>
            <a class="site-tab-btn site-home-link" href="https://naniwadekar.com/european-gaze/">Maps</a>
            <a class="site-tab-btn site-home-link" href="https://naniwadekar.com/basalt-and-laterite/">Basalt</a>
            <a class="site-tab-btn site-home-link" href="https://naniwadekar.com/atlas/">Atlas</a>
            <button class="site-tab-btn" data-tab="home">Home</button>
            <button class="site-tab-btn" data-tab="sites">Sites</button>
            <button class="site-tab-btn" data-tab="resources">Resources</button>
            <button class="site-tab-btn" data-tab="about">About</button>
          </nav>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-pressed="true"
          >
            Theme
          </button>
        </div>
      </header>

      <main class="site-main">
        <!-- Home / main field guide -->
        <section class="tab-content home-layout" data-tab-content="home">
          <aside id="sidebar" class="panel">
            <!-- Static header block to be preserved during rebuild -->
            <div class="sidebar-header-static">
              <!-- Filter and Sort Controls Block -->
              <div class="sidebar-filter-sort-block">
                <div class="sidebar-filter">
                  <label for="filter-select">Filter</label>
                  <select id="filter-select">
                    <option value="all">All Species</option>
                    <option value="endemic">Endemic Only</option>
                    <option value="with-photo">With Photo Only</option>
                    <!-- IUCN status options are injected from the data by app.js -->
                  </select>
                </div>
                <div class="sidebar-sort">
                  <label for="sort-select">Sort By</label>
                  <select id="sort-select">
                    <option value="common_name">Common Name</option>
                    <option value="scientific_name">Scientific Name</option>
                    <option value="status">Status (resident, visitor…)</option>
                  </select>
                </div>
              </div>
              <!-- END FILTER/SORT BLOCK -->

              <div class="sidebar-search">
                <div class="sidebar-search-label">Search</div>
                <div class="sidebar-search-input-wrap">
                  <span class="sidebar-search-icon">🔍</span>
                  <input
                    id="sidebar-search-input"
                    class="sidebar-search-input"
                    type="search"
                    placeholder="Search by name…"
                    autocomplete="off"
                  />
                </div>
              </div>
            </div>
          </aside>
          <section id="bird-info" class="panel"></section>
          <section id="bird-images" class="panel"></section>
        </section>

        <!-- About -->
        <section class="tab-content about-layout" data-tab-content="about">
          <div id="about-content"></div>
        </section>

        <!-- Sites -->
        <section class="tab-content sites-layout" data-tab-content="sites">
          <h2>Birding Sites in the Sahyadris</h2>
          <div id="sites-list"></div>
        </section>

        <!-- Resources -->
        <section
          class="tab-content resources-layout"
          data-tab-content="resources"
        >
          <div id="resources-list"></div>
        </section>
      </main>
    </div>

    <!-- Data and App Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/app.js"></script>
  <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("sahyadri-birds-sw.js", { scope: "./" })
            .catch(function (error) {
              console.warn("Offline support was not installed:", error);
            });
        });
      }
    </script>
</body>
</html>
